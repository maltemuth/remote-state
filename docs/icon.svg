<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Remote State">
  <title>Remote State</title>
  <!-- one state on the server, seen as a different view by each member -->
<style>
  svg { --a: #0969da; --b: #8250df; --c: #1a7f37; --line: #59636e; }
  @media (prefers-color-scheme: dark) { svg { --a: #4493f8; --b: #a371f7; --c: #3fb950; --line: #9198a1; } }
</style>
    <rect x="8" y="20" width="24" height="24" rx="5" fill="var(--a)"/>
    <g fill="none" stroke-width="3.5">
<rect x="36" y="8" width="20" height="20" rx="5" stroke="var(--b)"/>
<rect x="36" y="36" width="20" height="20" rx="5" stroke="var(--c)"/>
</g>
    <g fill="var(--b)">
<rect x="41" y="13" width="10" height="4" rx="1"/>
</g>
    <g fill="var(--c)">
<rect x="41" y="47" width="10" height="4" rx="1"/>
</g>
    <g stroke="var(--line)" stroke-width="3" stroke-linecap="round">
<line x1="32" y1="28" x2="36" y2="20"/>
<line x1="32" y1="36" x2="36" y2="44"/>
</g>
</svg>