<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 452" width="800" height="452" role="img" aria-labelledby="title desc">
  <title id="title">How Remote State works</title>
  <desc id="desc">Alice's and Bob's clients send actions to the server. Your rules turn the current state and an action into the new state. Your filter turns the state into each player's own view, which goes back to that player's client.</desc>
  <style>
    svg { --text: #1f2328; --muted: #59636e; --line: #59636e; --fill: #ffffff; --server: #f6f8fa;
          --action: #0969da; --state: #8250df; --view: #1a7f37;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --text: #e6edf3; --muted: #9198a1; --line: #9198a1; --fill: #151b23; --server: #0d1117;
            --action: #4493f8; --state: #a371f7; --view: #3fb950; }
    }
    .server { fill: var(--server); stroke: var(--line); stroke-dasharray: 6 5; }
    .server-label { fill: var(--muted); font-size: 14px; text-anchor: end; }
    .box { fill: var(--fill); stroke: var(--line); stroke-width: 1.5; }
    .glow { fill: var(--action); }
    .title { fill: var(--text); font-size: 17px; font-weight: 600; text-anchor: middle; }
    .sub { fill: var(--muted); font-size: 14px; text-anchor: middle; }
    .arrow { fill: none; stroke-width: 2; }
    .label { font-size: 14px; }
    .action { stroke: var(--action); } .state { stroke: var(--state); } .view { stroke: var(--view); }
    .dot, .head, .label { stroke: none; }
    .dot.action, .head.action, .label.action { fill: var(--action); }
    .dot.state, .head.state, .label.state { fill: var(--state); }
    .dot.view, .head.view, .label.view { fill: var(--view); }
    @media (prefers-reduced-motion: reduce) { .anim { display: none; } }
  </style>
  <defs>
    <marker id="head-action" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head action" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="head-state" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head state" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="head-view" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head view" d="M 0 0 L 10 5 L 0 10 z"/></marker>
  </defs>
  <rect class="server" x="430" y="20" width="360" height="400" rx="14"/>
  <text class="server-label" x="776" y="410">server</text>
  <rect class="box" x="40" y="50" width="150" height="64" rx="10"/>
  <rect class="glow anim" x="40" y="50" width="150" height="64" rx="10" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.35;0;0;0.35;0;0;0.35;0;0" keyTimes="0.0000;0.0000;0.0187;0.0563;0.4375;0.4562;0.4938;0.9375;0.9563;0.9938;1.0000"/></rect>
  <text class="title" x="115" y="88">Alice’s client</text>
  <rect class="box" x="40" y="306" width="150" height="64" rx="10"/>
  <rect class="glow anim" x="40" y="306" width="150" height="64" rx="10" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.35;0;0;0.35;0;0;0.35;0;0" keyTimes="0.0000;0.4375;0.4562;0.4938;0.5000;0.5188;0.5563;0.9375;0.9563;0.9938;1.0000"/></rect>
  <text class="title" x="115" y="344">Bob’s client</text>
  <rect class="box" x="450" y="50" width="320" height="80" rx="10"/>
  <rect class="glow anim" x="450" y="50" width="320" height="80" rx="10" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.35;0;0;0.35;0;0" keyTimes="0.0000;0.1125;0.1313;0.1688;0.6125;0.6313;0.6688;1.0000"/></rect>
  <text class="title" x="610" y="86">your rules</text>
  <text class="sub" x="610" y="108">(current state, action) → new state</text>
  <rect class="box" x="450" y="178" width="320" height="76" rx="10"/>
  <rect class="glow anim" x="450" y="178" width="320" height="76" rx="10" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.35;0;0;0.35;0;0" keyTimes="0.0000;0.2125;0.2312;0.2687;0.7125;0.7313;0.7688;1.0000"/></rect>
  <text class="title" x="610" y="212">game state</text>
  <text class="sub" x="610" y="234">stored, with its history</text>
  <rect class="box" x="450" y="302" width="320" height="92" rx="10"/>
  <rect class="glow anim" x="450" y="302" width="320" height="92" rx="10" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.35;0;0;0.35;0;0" keyTimes="0.0000;0.3000;0.3187;0.3563;0.8000;0.8188;0.8563;1.0000"/></rect>
  <text class="title" x="610" y="344">your filter</text>
  <text class="sub" x="610" y="366">state → each player’s view</text>
  <path id="p-aliceAction" class="arrow action" d="M 190 78 L 448 78" marker-end="url(#head-action)"/>
  <path id="p-bobAction" class="arrow action" d="M 190 322 C 320 322 320 102 448 102" marker-end="url(#head-action)"/>
  <path id="p-newState" class="arrow state" d="M 610 130 L 610 176" marker-end="url(#head-state)"/>
  <path id="p-state" class="arrow state" d="M 610 254 L 610 300" marker-end="url(#head-state)"/>
  <path id="p-bobView" class="arrow view" d="M 448 352 L 192 352" marker-end="url(#head-view)"/>
  <path id="p-aliceView" class="arrow view" d="M 448 378 C 330 378 300 420 120 420 C 30 420 20 380 20 300 L 20 120 C 20 96 26 92 38 92" marker-end="url(#head-view)"/>
  <text class="label action" x="300" y="70" text-anchor="middle">action</text>
  <text class="label action" x="330" y="215">action</text>
  <text class="label state" x="622" y="158">new state</text>
  <text class="label state" x="622" y="282">state</text>
  <text class="label view" x="300" y="344" text-anchor="middle">Bob’s view</text>
  <text class="label view" x="150" y="444" text-anchor="middle">Alice’s view</text>
  <circle class="dot action anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1125;1"><mpath href="#p-aliceAction" xlink:href="#p-aliceAction"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0063;0.1062;0.1125;1"/>
  </circle>
  <circle class="dot state anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1500;0.2125;1"><mpath href="#p-newState" xlink:href="#p-newState"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1500;0.1563;0.2062;0.2125;1"/>
  </circle>
  <circle class="dot state anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2375;0.3000;1"><mpath href="#p-state" xlink:href="#p-state"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2375;0.2437;0.2938;0.3000;1"/>
  </circle>
  <circle class="dot view anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3375;0.4375;1"><mpath href="#p-aliceView" xlink:href="#p-aliceView"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3375;0.3438;0.4313;0.4375;1"/>
  </circle>
  <circle class="dot view anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3375;0.4375;1"><mpath href="#p-bobView" xlink:href="#p-bobView"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3375;0.3438;0.4313;0.4375;1"/>
  </circle>
  <circle class="dot action anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6125;1"><mpath href="#p-bobAction" xlink:href="#p-bobAction"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5062;0.6063;0.6125;1"/>
  </circle>
  <circle class="dot state anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6500;0.7125;1"><mpath href="#p-newState" xlink:href="#p-newState"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6500;0.6563;0.7063;0.7125;1"/>
  </circle>
  <circle class="dot state anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7375;0.8000;1"><mpath href="#p-state" xlink:href="#p-state"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7375;0.7438;0.7938;0.8000;1"/>
  </circle>
  <circle class="dot view anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8375;0.9375;1"><mpath href="#p-aliceView" xlink:href="#p-aliceView"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8375;0.8438;0.9313;0.9375;1"/>
  </circle>
  <circle class="dot view anim" r="7" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8375;0.9375;1"><mpath href="#p-bobView" xlink:href="#p-bobView"/></animateMotion>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8375;0.8438;0.9313;0.9375;1"/>
  </circle>
</svg>
